[package]
name = "meteora-sniper-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Solana core (versiones compatibles con yellowstone-grpc 10.1)
solana-sdk = "2.0"
solana-client = "2.0"
solana-transaction-status = "2.0"

# Yellowstone gRPC for fastest pool monitoring
yellowstone-grpc-client = "10.1"
yellowstone-grpc-proto = "10.1"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "1.5"
bincode = "1.3"
base64 = "0.22"

# Anchor for deserializing Meteora accounts
anchor-lang = { version = "0.30", features = [] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenv = "0.15"

# Math for price calculations
num-traits = "0.2"

[patch.crates-io]
# Patch para resolver conflictos de versiones en solana-sdk
curve25519-dalek = "=3.2.1"
