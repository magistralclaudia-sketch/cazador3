[package]
name = "meteora-sniper-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Solana core 1.18 (compatible con tu instalación)
solana-sdk = "1.18"
solana-client = "1.18"
solana-transaction-status = "1.18"

# SPL Token (versiones compatibles con Solana 1.18)
spl-token = "4.0"
spl-associated-token-account = "3.0"

# Yellowstone gRPC v1.13 (compatible con Solana 1.18)
# Nota: La versión del plugin puede ser diferente a la del cliente
yellowstone-grpc-client = "1.13"
yellowstone-grpc-proto = "1.13"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"

# gRPC and networking
tonic = "0.10"
prost = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "1.5"
bincode = "1.3"
base64 = "0.22"
bs58 = "0.5"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }

# HTTP client for Jito bundles
reqwest = { version = "0.11", features = ["json"] }

# Anchor for deserializing Meteora accounts
anchor-lang = { version = "0.30", features = [] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenv = "0.15"

# Math for price calculations
num-traits = "0.2"
rust_decimal = "1.33"

# SHA256 for calculating Anchor discriminators
sha2 = "0.10"

# Jito for MEV bundles (optional, ultra-fast execution)
jito-searcher-client = { version = "0.0.1", optional = true }

[features]
default = []
jito = ["jito-searcher-client"]
